<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waybar Mirror</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="bar" class="bar"></main>

    <script type="module">
      import * as zebar from "https://esm.sh/zebar?bundle";

      const providers = zebar.createProviderGroup({
        glazewm: { type: "glazewm" },
        date: { type: "date", formatting: "HH:mm:ss" },
        cpu: { type: "cpu", refreshInterval: 1000 },
        memory: { type: "memory", refreshInterval: 5000 },
        network: { type: "network", refreshInterval: 1000 },
        audio: { type: "audio" },
        battery: { type: "battery", refreshInterval: 5000 },
        disk: { type: "disk", refreshInterval: 30000 },
        media: { type: "media" },
        weather: { type: "weather" },
        keyboard: { type: "keyboard" },
        systray: { type: "systray" }
      });

      const bar = document.getElementById("bar");

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function spawnShell(program, args = "") {
        if (!zebar.shellSpawn) {
          console.warn("Zebar shellSpawn API is unavailable.", { program, args });
          return;
        }

        try {
          const result = zebar.shellSpawn(program, args);

          if (result?.catch) {
            result.catch(() => zebar.shellSpawn({ program, args }));
          }
        } catch (error) {
          zebar.shellSpawn({ program, args });
        }
      }

      function runShellAction(actionName) {
        const actions = {
          launcher: ["powershell.exe", "-WindowStyle Hidden -Command Start-Process 'ms-windows-search:'"],
          theme: ["explorer.exe", "ms-settings:personalization-colors"],
          files: ["explorer.exe", ""],
          terminal: ["wt.exe", ""],
          browser: ["explorer.exe", "https://"],
          settings: ["explorer.exe", "ms-settings:"],
          notifications: ["explorer.exe", "ms-actioncenter:"],
          update: ["explorer.exe", "ms-settings:windowsupdate"],
          trayFlyout: ["explorer.exe", "shell:::{05d7b0f4-2121-4eff-bf6b-ed3f69b894d9}"],
          wifi: ["powershell.exe", "-WindowStyle Hidden -Command Start-Process 'ms-availablenetworks:'"],
          audioSettings: ["explorer.exe", "ms-settings:sound"],
          taskManager: ["taskmgr.exe", ""],
          nightlight: ["explorer.exe", "ms-settings:nightlight"],
          lock: ["rundll32.exe", "user32.dll,LockWorkStation"]
        };
        const [program, args] = actions[actionName] ?? [];

        if (program) {
          spawnShell(program, args);
        }
      }

      function runGlazeCommand(command) {
        providers.outputMap.glazewm?.runCommand?.(command);
      }

      function formatDataSize(value) {
        const bytes = typeof value === "number" ? value : value?.bytes;

        if (!bytes || bytes < 1024) return "";
        if (bytes < 1048576) return `${(bytes / 1024).toFixed(0)}K`;
        return `${(bytes / 1048576).toFixed(bytes >= 104857600 ? 0 : 1)}M`;
      }

      function formatNetworkSpeed(tx, rx) {
        const upload = formatDataSize(tx);
        const download = formatDataSize(rx);

        if (!upload && !download) return "idle";
        if (!upload) return `↓ ${download}`;
        if (!download) return `↑ ${upload}`;
        return `↑ ${upload} ↓ ${download}`;
      }

      function formatUsedMemory(memory) {
        const usedBytes = memory?.usedMemory?.bytes ?? memory?.usedSize ?? memory?.usage?.bytes;
        return `${((usedBytes ?? 0) / 1073741824).toFixed(1)}G`;
      }

      function getDiskUsage(disk) {
        const total = disk?.totalSpace?.bytes ?? disk?.totalSpace;
        const available = disk?.availableSpace?.bytes ?? disk?.availableSpace;
        return total && available != null ? Math.round(((total - available) / total) * 100) : null;
      }

      function getNetworkInterface(network) {
        return network?.defaultInterface ?? network?.interfaces?.find((item) => item?.ipv4Addresses?.length) ?? null;
      }

      function getNetworkIcon(networkInterface) {
        if (!networkInterface) return "󰌙";
        if (networkInterface.type === "wifi") return "󰤨";
        if (networkInterface.type === "ethernet") return "󰌘";
        return "󰈁";
      }

      function getVolumeIcon(device) {
        const volume = getDeviceVolume(device);
        if (!device || device.isMuted || volume === 0) return "󰖁";
        if (volume < 33) return "";
        if (volume < 66) return "";
        return "󰕾";
      }

      function getBatteryIcon(battery) {
        const chargePercent = battery?.chargePercent ?? battery?.percentage ?? battery?.capacity;
        if (battery?.isCharging) return "";
        if (chargePercent == null) return "󰂑";
        if (chargePercent >= 95) return "󰁹";
        if (chargePercent >= 65) return "󰂀";
        if (chargePercent >= 35) return "󰁾";
        if (chargePercent >= 15) return "󰁻";
        return "󰂎";
      }

      function getWindowIcon(windowLike) {
        const source = `${windowLike?.processName ?? ""} ${windowLike?.className ?? ""} ${windowLike?.title ?? ""}`;
        const rules = [
          [/firefox|zen|librewolf|browser/i, ""],
          [/chrome|chromium|edge|brave/i, ""],
          [/terminal|wezterm|alacritty|kitty|powershell|cmd|wt/i, ""],
          [/code|codium|vscode/i, "󰨞"],
          [/discord|vesktop/i, ""],
          [/signal/i, "󰍩"],
          [/telegram/i, ""],
          [/spotify/i, ""],
          [/youtube/i, ""],
          [/github/i, ""]
        ];

        return rules.find(([pattern]) => pattern.test(source))?.[1] ?? "";
      }

      function getWorkspaces(glazewm) {
        return glazewm?.currentWorkspaces ?? glazewm?.allWorkspaces ?? glazewm?.workspaces ?? [];
      }

      function getWorkspaceWindows(workspace) {
        return workspace?.children ?? workspace?.windows ?? workspace?.containers ?? [];
      }

      function renderWorkspaces(glazewm) {
        return getWorkspaces(glazewm).map((workspace) => {
          const windows = getWorkspaceWindows(workspace);
          const isFocused = workspace.hasFocus || workspace.isFocused || glazewm?.displayedWorkspace?.name === workspace.name;
          const isDisplayed = workspace.isDisplayed || glazewm?.displayedWorkspace?.name === workspace.name;
          const windowIcons = windows.slice(0, 4).map((windowLike) => `<span>${getWindowIcon(windowLike)}</span>`).join("");

          return `
            <button
              class="workspace ${isFocused ? "active" : ""} ${isDisplayed ? "displayed" : ""}"
              data-workspace="${escapeHtml(workspace.name)}"
              title="Workspace ${escapeHtml(workspace.name)}"
            >
              <span>${escapeHtml(workspace.displayName ?? workspace.name)}</span>
              ${windowIcons ? `<span class="workspace-windows">${windowIcons}</span>` : ""}
            </button>
          `;
        }).join("");
      }

      function renderPlayer(media) {
        const session = media?.currentSession ?? media?.sessions?.[0];
        const artist = session?.artist ?? session?.metadata?.artist;
        const title = session?.title ?? session?.metadata?.title;
        const label = [artist, title].filter(Boolean).join("  ");

        if (!label) {
          return "";
        }

        return `
          <button class="player" data-action="media-play-pause" title="${escapeHtml(label)}">
            <span></span>
            <span>${escapeHtml(label)}</span>
          </button>
        `;
      }

      function renderTray(systray) {
        const items = systray?.items ?? systray?.icons ?? [];
        const visibleItems = items.slice(0, 10);
        const overflowCount = Math.max(0, items.length - visibleItems.length);

        return `${visibleItems.map((item) => `
          <button class="tray-icon" type="button" data-tray-icon="${escapeHtml(item.id ?? "")}" title="${escapeHtml(item.tooltip ?? item.title ?? "")}">
            ${item.iconUrl ? `<img src="${escapeHtml(item.iconUrl)}" alt="" />` : `<span>${escapeHtml(item.icon ?? "●")}</span>`}
          </button>
        `).join("")}${overflowCount ? `<span class="tray-more" title="${overflowCount} hidden tray icons">+${overflowCount}</span>` : ""}`;
      }

      function render(output) {
        const glazewm = output.glazewm;
        const focusedWindow = glazewm?.focusedWindow ?? glazewm?.focusedContainer;
        const networkInterface = getNetworkInterface(output.network);
        const tx = networkInterface?.transmitSpeed ?? networkInterface?.txBytesPerSec ?? networkInterface?.bandwidthUpBytes;
        const rx = networkInterface?.receiveSpeed ?? networkInterface?.rxBytesPerSec ?? networkInterface?.bandwidthDownBytes;
        const playback = output.audio?.defaultPlaybackDevice;
        const recording = output.audio?.defaultRecordingDevice;
        const mainDisk = output.disk?.disks?.find((item) => !item.isRemovable) ?? output.disk?.disks?.[0];
        const diskUsage = getDiskUsage(mainDisk);
        const chargePercent = output.battery?.chargePercent ?? output.battery?.percentage ?? output.battery?.capacity;
        const currentWeather = output.weather?.current;
        const weatherTemp = currentWeather?.temperatureCelsius ?? currentWeather?.temperature?.celsius ?? currentWeather?.tempC;
        const weatherLabel = weatherTemp == null ? "󰖐" : `󰖐 ${Math.round(weatherTemp)}C`;
        const capsActive = output.keyboard?.capsLock || output.keyboard?.capslock;
        const playbackVolume = getDeviceVolume(playback);
        const recordingVolume = getDeviceVolume(recording);

        bar.innerHTML = `
          <section class="left">
            <span class="cava">▁▂▃▄▅▆▇</span>
            ${renderPlayer(output.media)}
            <div class="window-title" title="${escapeHtml(focusedWindow?.title ?? "")}">
              ${focusedWindow?.title ? `${getWindowIcon(focusedWindow)} ${escapeHtml(focusedWindow.title)}` : ""}
            </div>
          </section>

          <section class="center">
            <div class="drawer app-drawer">
              <button class="icon-button" data-shell="launcher" title="Launcher"></button>
              <div class="drawer-panel from-left">
                <button class="icon-button" data-shell="theme" title="Theme">󰔎</button>
                <button class="icon-button" data-shell="files" title="File Explorer"></button>
                <button class="icon-button" data-shell="terminal" title="Terminal"></button>
                <button class="icon-button" data-shell="browser" title="Browser"></button>
                <button class="icon-button" data-shell="settings" title="Settings"></button>
              </div>
            </div>
            <span class="separator">·</span>
            <div class="drawer notify-drawer">
              <button class="icon-button" data-shell="notifications" title="Notifications"></button>
              <div class="drawer-panel from-left compact-panel">
                <button class="icon-button" data-shell="update" title="Windows Update">󰁈</button>
              </div>
            </div>
            <span class="separator">·</span>
            <div class="workspaces">${renderWorkspaces(glazewm)}</div>
            <span class="clock"> ${escapeHtml(output.date?.formatted ?? "--:--:--")}</span>
            <span class="separator">·</span>
            <span class="module weather ${weatherTemp == null ? "muted" : ""}">${weatherLabel}</span>
            <span class="separator">·</span>
            <span class="icon-button" title="Idle inhibitor placeholder"></span>
          </section>

          <section class="right">
            <button class="icon-button tray-flyout" data-shell="trayFlyout" title="Open Windows notification area icons">▴</button>
            <div class="tray">${renderTray(output.systray)}</div>
            <button class="module network" data-shell="wifi" title="Open Wi-Fi networks">
              ${getNetworkIcon(networkInterface)} ${formatNetworkSpeed(tx, rx)}
            </button>
            <span class="separator">·</span>
            <div class="drawer mobo-drawer">
              <button class="module temperature ${(output.cpu?.usage ?? 0) > 90 ? "critical" : ""}" data-shell="taskManager" title="Open Task Manager">󰈸</button>
              <div class="drawer-panel from-right">
                <button class="module cpu ${(output.cpu?.usage ?? 0) > 90 ? "critical" : (output.cpu?.usage ?? 0) > 70 ? "warning" : ""}" data-shell="taskManager" title="Open Task Manager">
                  ${Math.round(output.cpu?.usage ?? 0)}% 󰍛
                </button>
                <span class="module power-profile"></span>
                <span class="module memory">${formatUsedMemory(output.memory)} 󰾆</span>
                ${diskUsage == null ? "" : `<span class="module disk">${diskUsage}% 󰋊</span>`}
                ${chargePercent == null ? "" : `<span class="module battery ${chargePercent <= 15 ? "critical" : ""}">${getBatteryIcon(output.battery)} ${Math.round(chargePercent)}%</span>`}
              </div>
            </div>
            <span class="separator">|</span>
            <div class="drawer audio-drawer">
              <button class="module audio ${playbackVolume === 0 ? "muted" : ""}" data-action="audio-toggle" title="Mute/unmute audio">
                ${getVolumeIcon(playback)} ${playbackVolume === 0 ? "" : `${Math.round(playbackVolume)}%`}
              </button>
              <div class="drawer-panel from-right compact-panel">
                <button class="module mic ${recordingVolume === 0 ? "muted" : ""}" data-shell="audioSettings" title="Open sound settings">
                  ${recordingVolume === 0 ? "" : ""} ${Math.round(recordingVolume)}%
                </button>
              </div>
            </div>
            <span class="separator">·</span>
            <button class="icon-button nightlight" data-shell="nightlight" title="Night light">󰖔</button>
            <span class="separator">·</span>
            <div class="drawer status-drawer">
              <button class="icon-button lock" data-shell="lock" title="Lock workstation">󰌾</button>
              <div class="drawer-panel from-right">
                <span class="module keyboard ${capsActive ? "active" : ""}">󰪛 ${capsActive ? "" : ""}</span>
              </div>
            </div>
          </section>
        `;

        currentOutput = output;
      }

      let currentOutput = providers.outputMap;

      bar.addEventListener("click", (event) => {
        const eventTarget = event.target instanceof Element ? event.target : event.target.parentElement;
        const target = eventTarget?.closest("[data-workspace], [data-action], [data-shell], [data-tray-icon]");

        if (!target) {
          return;
        }

        event.preventDefault();
        event.stopPropagation();

        if (target.dataset.workspace) {
          runGlazeCommand(`focus-workspace ${target.dataset.workspace}`);
          return;
        }

        if (target.dataset.trayIcon) {
          currentOutput.systray?.onLeftClick?.(target.dataset.trayIcon);
          return;
        }

        if (target.dataset.action === "media-play-pause") {
          currentOutput.media?.playPause?.();
          return;
        }

        if (target.dataset.action === "audio-toggle") {
          togglePlaybackVolume();
          return;
        }

        if (target.dataset.shell) {
          runShellAction(target.dataset.shell);
        }
      });

      bar.addEventListener("dblclick", (event) => {
        const eventTarget = event.target instanceof Element ? event.target : event.target.parentElement;
        const target = eventTarget?.closest("[data-tray-icon]");

        if (!target?.dataset.trayIcon) {
          return;
        }

        event.preventDefault();
        event.stopPropagation();
        currentOutput.systray?.onLeftDoubleClick?.(target.dataset.trayIcon);
      });

      bar.addEventListener("contextmenu", (event) => {
        const eventTarget = event.target instanceof Element ? event.target : event.target.parentElement;
        const target = eventTarget?.closest("[data-tray-icon]");

        if (!target?.dataset.trayIcon) {
          return;
        }

        event.preventDefault();
        event.stopPropagation();
        currentOutput.systray?.onRightClick?.(target.dataset.trayIcon);
      });

      bar.addEventListener("auxclick", (event) => {
        const eventTarget = event.target instanceof Element ? event.target : event.target.parentElement;
        const target = eventTarget?.closest("[data-tray-icon]");

        if (!target?.dataset.trayIcon || event.button !== 1) {
          return;
        }

        event.preventDefault();
        event.stopPropagation();
        currentOutput.systray?.onMiddleClick?.(target.dataset.trayIcon);
      });

      bar.addEventListener("mouseover", (event) => {
        const eventTarget = event.target instanceof Element ? event.target : event.target.parentElement;
        const target = eventTarget?.closest("[data-tray-icon]");

        if (!target?.dataset.trayIcon || (event.relatedTarget instanceof Node && target.contains(event.relatedTarget))) {
          return;
        }

        currentOutput.systray?.onHoverEnter?.(target.dataset.trayIcon);
      });

      bar.addEventListener("mouseout", (event) => {
        const eventTarget = event.target instanceof Element ? event.target : event.target.parentElement;
        const target = eventTarget?.closest("[data-tray-icon]");

        if (!target?.dataset.trayIcon || (event.relatedTarget instanceof Node && target.contains(event.relatedTarget))) {
          return;
        }

        currentOutput.systray?.onHoverLeave?.(target.dataset.trayIcon);
      });

      bar.addEventListener("mousemove", (event) => {
        const eventTarget = event.target instanceof Element ? event.target : event.target.parentElement;
        const target = eventTarget?.closest("[data-tray-icon]");

        if (!target?.dataset.trayIcon) {
          return;
        }

        currentOutput.systray?.onHoverMove?.(target.dataset.trayIcon);
      });

      bar.addEventListener("wheel", (event) => {
        const eventTarget = event.target instanceof Element ? event.target : event.target.parentElement;

        if (eventTarget?.closest(".workspaces")) {
          event.preventDefault();
          runGlazeCommand(event.deltaY > 0 ? "focus-next-workspace" : "focus-prev-workspace");
        }
      });

      let previousPlaybackVolume = 40;

      function getDeviceVolume(device) {
        return device?.volume ?? device?.volumePercent ?? 0;
      }

      function togglePlaybackVolume() {
        const audio = currentOutput.audio;
        const playback = audio?.defaultPlaybackDevice;
        const currentVolume = getDeviceVolume(playback);

        if (!audio?.setVolume) {
          runShellAction("audioSettings");
          return;
        }

        if (currentVolume > 0) {
          previousPlaybackVolume = currentVolume;
          audio.setVolume(0);
          return;
        }

        audio.setVolume(Math.max(previousPlaybackVolume, 20));
      }

      providers.onOutput(() => render({ ...providers.outputMap }));
      render(providers.outputMap);
    </script>
  </body>
</html>
