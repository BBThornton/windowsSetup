<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waybar Mirror</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="bar" class="bar">
      <section class="left">
        <span class="cava">▁▂▃▄▅▆▇</span>
        <button id="player" class="player is-hidden" data-action="media-play-pause" title="Media">
          <span></span>
          <span id="player-text"></span>
        </button>
        <div id="window-title" class="window-title"></div>
      </section>

      <section class="center">
        <div class="drawer app-drawer">
          <button class="icon-button" data-shell="launcher" title="Launcher"></button>
          <div class="drawer-panel from-left">
            <button class="icon-button" data-shell="theme" title="Theme">󰔎</button>
            <button class="icon-button" data-shell="files" title="File Explorer"></button>
            <button class="icon-button" data-shell="terminal" title="Terminal"></button>
            <button class="icon-button" data-shell="browser" title="Browser"></button>
            <button class="icon-button" data-shell="settings" title="Settings"></button>
          </div>
        </div>
        <span class="separator">·</span>
        <div class="drawer notify-drawer">
          <button class="icon-button" data-shell="notifications" title="Notifications"></button>
          <div class="drawer-panel from-left compact-panel">
            <button class="icon-button" data-shell="update" title="Windows Update">󰁈</button>
          </div>
        </div>
        <span class="separator">·</span>
        <div id="workspaces" class="workspaces"></div>
        <span id="clock" class="clock"> --:--:--</span>
        <span class="separator">·</span>
        <span id="weather" class="module weather muted">󰖐</span>
        <span class="separator">·</span>
        <span class="icon-button" title="Idle inhibitor placeholder"></span>
      </section>

      <section class="right">
        <div id="tray-drawer" class="drawer tray-drawer">
          <button id="tray-toggle" class="icon-button tray-toggle" data-action="tray-toggle" title="Toggle tray icons">▴</button>
          <div id="tray-panel" class="drawer-panel tray-panel from-right"></div>
        </div>
        <div id="tray" class="tray"></div>
        <button id="network" class="module network" data-shell="wifi" title="Open Wi-Fi networks">󰌙 idle</button>
        <span class="separator">·</span>
        <div class="drawer mobo-drawer">
          <button id="temperature" class="module temperature" data-shell="taskManager" title="Open Task Manager">󰈸</button>
          <div class="drawer-panel from-right">
            <button id="cpu" class="module cpu" data-shell="taskManager" title="Open Task Manager">0% 󰍛</button>
            <span class="module power-profile"></span>
            <span id="memory" class="module memory">0.0G 󰾆</span>
            <span id="disk" class="module disk is-hidden"></span>
            <span id="battery" class="module battery is-hidden"></span>
          </div>
        </div>
        <span class="separator">|</span>
        <div class="drawer audio-drawer">
          <button id="audio" class="module audio" data-action="audio-toggle" title="Mute/unmute audio; right-click for sound settings">󰖁</button>
          <div class="drawer-panel from-right compact-panel">
            <button id="mic" class="module mic" data-shell="audioSettings" title="Open sound settings"> 0%</button>
          </div>
        </div>
        <span class="separator">·</span>
        <button class="icon-button nightlight" data-shell="nightlight" title="Night light">󰖔</button>
        <span class="separator">·</span>
        <div class="drawer status-drawer">
          <button class="icon-button lock" data-shell="lock" title="Lock workstation">󰌾</button>
          <div class="drawer-panel from-right">
            <span id="keyboard" class="module keyboard">󰪛 </span>
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      import * as zebar from "https://esm.sh/zebar?bundle";

      const bar = document.getElementById("bar");
      const providers = zebar.createProviderGroup({
        glazewm: { type: "glazewm" },
        date: { type: "date", formatting: "HH:mm:ss" },
        cpu: { type: "cpu", refreshInterval: 1000 },
        memory: { type: "memory", refreshInterval: 5000 },
        network: { type: "network", refreshInterval: 1000 },
        audio: { type: "audio" },
        battery: { type: "battery", refreshInterval: 5000 },
        disk: { type: "disk", refreshInterval: 30000 },
        media: { type: "media" },
        weather: { type: "weather" },
        keyboard: { type: "keyboard" },
        systray: { type: "systray" }
      });

      const elements = {
        audio: document.getElementById("audio"),
        battery: document.getElementById("battery"),
        clock: document.getElementById("clock"),
        cpu: document.getElementById("cpu"),
        disk: document.getElementById("disk"),
        keyboard: document.getElementById("keyboard"),
        memory: document.getElementById("memory"),
        mic: document.getElementById("mic"),
        network: document.getElementById("network"),
        player: document.getElementById("player"),
        playerText: document.getElementById("player-text"),
        temperature: document.getElementById("temperature"),
        tray: document.getElementById("tray"),
        trayDrawer: document.getElementById("tray-drawer"),
        trayPanel: document.getElementById("tray-panel"),
        trayToggle: document.getElementById("tray-toggle"),
        weather: document.getElementById("weather"),
        windowTitle: document.getElementById("window-title"),
        workspaces: document.getElementById("workspaces")
      };

      let currentOutput = providers.outputMap;
      let previousPlaybackVolume = 40;
      let previousWorkspaceSignature = "";
      let previousTraySignature = "";
      let isTrayExpanded = false;
      const visibleTrayIconCount = 4;

      function spawnShell(program, args = "") {
        if (!zebar.shellSpawn) {
          console.warn("Zebar shellSpawn API is unavailable.", { program, args });
          return;
        }

        try {
          const result = zebar.shellSpawn(program, args);
          result?.catch?.(() => zebar.shellSpawn({ program, args }));
        } catch (error) {
          zebar.shellSpawn({ program, args });
        }
      }

      function runShellAction(actionName) {
        const actions = {
          launcher: ["powershell.exe", "-WindowStyle Hidden -Command Start-Process 'ms-windows-search:'"],
          theme: ["explorer.exe", "ms-settings:personalization-colors"],
          files: ["explorer.exe", ""],
          terminal: ["wt.exe", ""],
          browser: ["explorer.exe", "https://"],
          settings: ["explorer.exe", "ms-settings:"],
          notifications: ["explorer.exe", "ms-actioncenter:"],
          update: ["explorer.exe", "ms-settings:windowsupdate"],
          wifi: ["powershell.exe", "-WindowStyle Hidden -Command Start-Process 'ms-availablenetworks:'"],
          audioSettings: ["explorer.exe", "ms-settings:sound"],
          taskManager: ["taskmgr.exe", ""],
          nightlight: ["explorer.exe", "ms-settings:nightlight"],
          lock: ["rundll32.exe", "user32.dll,LockWorkStation"]
        };
        const [program, args] = actions[actionName] ?? [];
        if (program) spawnShell(program, args);
      }

      function runGlazeCommand(command) {
        currentOutput.glazewm?.runCommand?.(command);
      }

      function setText(element, value) {
        const text = String(value ?? "");
        if (element.textContent !== text) element.textContent = text;
      }

      function setHidden(element, isHidden) {
        element.classList.toggle("is-hidden", isHidden);
      }

      function setClassFlag(element, className, enabled) {
        element.classList.toggle(className, Boolean(enabled));
      }

      function formatDataSize(value) {
        if (typeof value === "object" && value?.iecValue != null && value?.iecUnit) {
          return `${value.iecValue.toFixed(value.iecValue >= 100 ? 0 : 1)}${value.iecUnit}`;
        }

        const bytes = typeof value === "number" ? value : value?.bytes;
        if (!bytes || bytes < 1024) return "";
        if (bytes < 1048576) return `${(bytes / 1024).toFixed(0)}K`;
        return `${(bytes / 1048576).toFixed(bytes >= 104857600 ? 0 : 1)}M`;
      }

      function formatNetworkSpeed(tx, rx) {
        const upload = formatDataSize(tx);
        const download = formatDataSize(rx);
        if (!upload && !download) return "idle";
        if (!upload) return `↓ ${download}`;
        if (!download) return `↑ ${upload}`;
        return `↑ ${upload} ↓ ${download}`;
      }

      function formatUsedMemory(memory) {
        const usedBytes = memory?.usedMemory?.bytes ?? memory?.usedSize ?? memory?.usage?.bytes;
        return `${((usedBytes ?? 0) / 1073741824).toFixed(1)}G`;
      }

      function getDiskUsage(disk) {
        const total = disk?.totalSpace?.bytes ?? disk?.totalSpace;
        const available = disk?.availableSpace?.bytes ?? disk?.availableSpace;
        return total && available != null ? Math.round(((total - available) / total) * 100) : null;
      }

      function getNetworkInterface(network) {
        return network?.defaultInterface ?? network?.interfaces?.find((item) => item?.ipv4Addresses?.length) ?? null;
      }

      function getNetworkIcon(networkInterface) {
        if (!networkInterface) return "󰌙";
        if (networkInterface.type === "wifi") return "󰤨";
        if (networkInterface.type === "ethernet") return "󰌘";
        return "󰈁";
      }

      function getDeviceVolume(device) {
        return device?.volume ?? device?.volumePercent ?? 0;
      }

      function getDeviceId(device) {
        return device?.deviceId ?? device?.id;
      }

      function getVolumeIcon(device) {
        const volume = getDeviceVolume(device);
        if (!device || device.isMuted || volume === 0) return "󰖁";
        if (volume < 33) return "";
        if (volume < 66) return "";
        return "󰕾";
      }

      function getBatteryIcon(battery) {
        const chargePercent = battery?.chargePercent ?? battery?.percentage ?? battery?.capacity;
        if (battery?.isCharging) return "";
        if (chargePercent == null) return "󰂑";
        if (chargePercent >= 95) return "󰁹";
        if (chargePercent >= 65) return "󰂀";
        if (chargePercent >= 35) return "󰁾";
        if (chargePercent >= 15) return "󰁻";
        return "󰂎";
      }

      function getWindowIcon(windowLike) {
        const source = `${windowLike?.processName ?? ""} ${windowLike?.className ?? ""} ${windowLike?.title ?? ""}`;
        const rules = [
          [/firefox|zen|librewolf|browser/i, ""],
          [/chrome|chromium|edge|brave/i, ""],
          [/terminal|wezterm|alacritty|kitty|powershell|pwsh|cmd|wt|windows terminal/i, ""],
          [/code|codium|vscode|visual studio code/i, "󰨞"],
          [/visual studio|devenv/i, ""],
          [/jetbrains|idea|webstorm|pycharm|rider|clion|goland|phpstorm|rubymine/i, ""],
          [/explorer|file explorer/i, ""],
          [/discord|vesktop/i, ""],
          [/slack/i, ""],
          [/teams|msteams/i, "󰊻"],
          [/signal/i, "󰍩"],
          [/telegram/i, ""],
          [/spotify/i, ""],
          [/youtube/i, ""],
          [/github|git/i, ""],
          [/obsidian/i, "󰠮"],
          [/notion/i, ""],
          [/onenote/i, "󰝒"],
          [/outlook|mail/i, "󰇮"],
          [/word|winword/i, "󰈬"],
          [/excel/i, "󰈛"],
          [/powerpoint/i, "󰈧"],
          [/photoshop/i, ""],
          [/illustrator/i, ""],
          [/figma/i, ""],
          [/steam/i, ""],
          [/docker/i, ""],
          [/obs64|obs studio/i, "󰐌"],
          [/vlc/i, "󰕼"],
          [/notepad/i, "󰎞"],
          [/calculator/i, ""],
          [/settings|systemsettings/i, ""],
          [/taskmgr|task manager/i, ""]
        ];
        return rules.find(([pattern]) => pattern.test(source))?.[1] ?? "";
      }

      function getWeatherIcon(weather) {
        const status = String(weather?.status ?? weather?.current?.condition ?? weather?.current?.weatherDescription ?? "").toLowerCase();
        if (/clear|sun/.test(status)) return "";
        if (/rain|drizzle|shower/.test(status)) return "";
        if (/snow|sleet|ice/.test(status)) return "";
        if (/storm|thunder/.test(status)) return "";
        if (/fog|mist|haze/.test(status)) return "󰖑";
        if (/cloud|overcast/.test(status)) return "";
        return "󰖐";
      }

      function getTraySearchText(item) {
        return [
          item?.tooltip,
          item?.title,
          item?.id
        ].filter(Boolean).join(" ").toLowerCase();
      }

      function isHiddenTrayIcon(item) {
        const text = getTraySearchText(item);
        return [
          /meet now/,
          /safely remove hardware/,
          /eject media/,
          /eject .*media/,
          /remove hardware/,
          /\bvolume\b/,
          /\bspeaker\b/,
          /\bspeakers\b/,
          /realtek.*audio/,
          /sound.*output/
        ].some((pattern) => pattern.test(text));
      }

      function getWorkspaces(glazewm) {
        return glazewm?.currentWorkspaces ?? glazewm?.allWorkspaces ?? glazewm?.workspaces ?? [];
      }

      function getWorkspaceWindows(workspace) {
        return workspace?.children ?? workspace?.windows ?? workspace?.containers ?? [];
      }

      function update(output) {
        currentOutput = output;

        updateWindow(output.glazewm);
        updatePlayer(output.media);
        updateWorkspaces(output.glazewm);
        updateClock(output.date);
        updateWeather(output.weather);
        updateTray(output.systray);
        updateNetwork(output.network);
        updateMobo(output);
        updateAudio(output.audio);
        updateKeyboard(output.keyboard);
      }

      function updateWindow(glazewm) {
        const focusedWindow = glazewm?.focusedWindow ?? glazewm?.focusedContainer;
        const label = focusedWindow?.title ? `${getWindowIcon(focusedWindow)} ${focusedWindow.title}` : "";
        setText(elements.windowTitle, label);
        elements.windowTitle.title = focusedWindow?.title ?? "";
      }

      function updatePlayer(media) {
        const session = media?.currentSession ?? media?.sessions?.[0];
        const label = [session?.artist ?? session?.metadata?.artist, session?.title ?? session?.metadata?.title].filter(Boolean).join("  ");
        setHidden(elements.player, !label);
        if (label) {
          setText(elements.playerText, label);
          elements.player.title = label;
        }
      }

      function updateWorkspaces(glazewm) {
        const workspaces = getWorkspaces(glazewm);
        const signature = JSON.stringify(workspaces.map((workspace) => ({
          name: workspace.name,
          displayName: workspace.displayName,
          focused: workspace.hasFocus || workspace.isFocused || glazewm?.displayedWorkspace?.name === workspace.name,
          displayed: workspace.isDisplayed || glazewm?.displayedWorkspace?.name === workspace.name,
          windows: getWorkspaceWindows(workspace).slice(0, 4).map(getWindowIcon)
        })));

        if (signature === previousWorkspaceSignature) return;
        previousWorkspaceSignature = signature;
        elements.workspaces.replaceChildren(...workspaces.map((workspace) => {
          const button = document.createElement("button");
          const windows = getWorkspaceWindows(workspace);
          const isFocused = workspace.hasFocus || workspace.isFocused || glazewm?.displayedWorkspace?.name === workspace.name;
          const isDisplayed = workspace.isDisplayed || glazewm?.displayedWorkspace?.name === workspace.name;

          button.className = `workspace ${isFocused ? "active" : ""} ${isDisplayed ? "displayed" : ""}`;
          button.dataset.workspace = workspace.name;
          button.title = `Workspace ${workspace.name}`;
          button.textContent = workspace.displayName ?? workspace.name;

          if (windows.length > 0) {
            const icons = document.createElement("span");
            icons.className = "workspace-windows";
            windows.slice(0, 4).forEach((windowLike) => {
              const icon = document.createElement("span");
              icon.className = "workspace-window-icon";
              icon.textContent = getWindowIcon(windowLike);
              icons.append(icon);
            });
            button.append(" ", icons);
          }

          return button;
        }));
      }

      function updateClock(date) {
        setText(elements.clock, ` ${date?.formatted ?? "--:--:--"}`);
      }

      function updateWeather(weather) {
        const current = weather?.current;
        const temperature = weather?.celsiusTemp ?? current?.temperatureCelsius ?? current?.temperature?.celsius ?? current?.tempC;
        const icon = getWeatherIcon(weather);
        setClassFlag(elements.weather, "muted", temperature == null);
        setText(elements.weather, temperature == null ? icon : `${icon} ${Math.round(temperature)}C`);
      }

      function updateTray(systray) {
        const items = (systray?.items ?? systray?.icons ?? []).filter((item) => !isHiddenTrayIcon(item));
        const compactItems = items.slice(0, visibleTrayIconCount);
        const signature = JSON.stringify({
          expanded: isTrayExpanded,
          items: items.map((item) => [item.id, item.iconHash, item.iconUrl, item.tooltip ?? item.title])
        });

        if (signature === previousTraySignature) return;
        previousTraySignature = signature;

        elements.tray.replaceChildren(...compactItems.map((item) => createTrayIcon(item, systray)));
        elements.trayPanel.replaceChildren(...items.map((item) => createTrayIcon(item, systray)));

        if (items.length > compactItems.length) {
          const more = document.createElement("span");
          more.className = "tray-more";
          more.title = `${items.length - compactItems.length} tray icons in dropdown`;
          more.textContent = `+${items.length - compactItems.length}`;
          elements.tray.append(more);
        }

        setClassFlag(elements.trayDrawer, "expanded", isTrayExpanded);
        elements.trayToggle.title = items.length ? `${isTrayExpanded ? "Hide" : "Show"} all ${items.length} tray icons` : "No tray icons";
        setText(elements.trayToggle, isTrayExpanded ? "▾" : "▴");
      }

      function createTrayIcon(item, systray) {
        const icon = document.createElement("span");
        icon.className = "tray-icon";
        icon.dataset.trayIcon = item.id;
        icon.title = item.tooltip ?? item.title ?? "";

        if (item.iconUrl) {
          const image = document.createElement("img");
          image.src = item.iconUrl;
          image.alt = "";
          icon.append(image);
        } else {
          icon.textContent = item.icon ?? "●";
        }

        icon.addEventListener("click", () => systray?.onLeftClick?.(item.id));
        icon.addEventListener("dblclick", () => systray?.onLeftDoubleClick?.(item.id));
        icon.addEventListener("contextmenu", (event) => {
          event.preventDefault();
          systray?.onRightClick?.(item.id);
        });
        icon.addEventListener("auxclick", (event) => {
          if (event.button === 1) {
            event.preventDefault();
            systray?.onMiddleClick?.(item.id);
          }
        });
        icon.addEventListener("mouseenter", () => systray?.onHoverEnter?.(item.id));
        icon.addEventListener("mouseleave", () => systray?.onHoverLeave?.(item.id));

        let pendingHoverMove = false;
        icon.addEventListener("mousemove", () => {
          if (pendingHoverMove) return;
          pendingHoverMove = true;
          requestAnimationFrame(() => {
            pendingHoverMove = false;
            systray?.onHoverMove?.(item.id);
          });
        });

        return icon;
      }

      function updateNetwork(network) {
        const networkInterface = getNetworkInterface(network);
        const tx = network?.traffic?.transmitted ?? networkInterface?.transmitSpeed ?? networkInterface?.txBytesPerSec ?? networkInterface?.bandwidthUpBytes;
        const rx = network?.traffic?.received ?? networkInterface?.receiveSpeed ?? networkInterface?.rxBytesPerSec ?? networkInterface?.bandwidthDownBytes;
        setText(elements.network, `${getNetworkIcon(networkInterface)} ${formatNetworkSpeed(tx, rx)}`);
        elements.network.title = networkInterface?.name ? `Open Wi-Fi networks (${networkInterface.name})` : "Open Wi-Fi networks";
      }

      function updateMobo(output) {
        const cpuUsage = output.cpu?.usage ?? 0;
        const mainDisk = output.disk?.disks?.find((item) => !item.isRemovable) ?? output.disk?.disks?.[0];
        const diskUsage = getDiskUsage(mainDisk);
        const chargePercent = output.battery?.chargePercent ?? output.battery?.percentage ?? output.battery?.capacity;

        setText(elements.cpu, `${Math.round(cpuUsage)}% 󰍛`);
        setClassFlag(elements.cpu, "warning", cpuUsage > 70 && cpuUsage <= 90);
        setClassFlag(elements.cpu, "critical", cpuUsage > 90);
        setClassFlag(elements.temperature, "critical", cpuUsage > 90);
        setText(elements.memory, `${formatUsedMemory(output.memory)} 󰾆`);

        setHidden(elements.disk, diskUsage == null);
        if (diskUsage != null) setText(elements.disk, `${diskUsage}% 󰋊`);

        setHidden(elements.battery, chargePercent == null);
        if (chargePercent != null) {
          setText(elements.battery, `${getBatteryIcon(output.battery)} ${Math.round(chargePercent)}%`);
          setClassFlag(elements.battery, "critical", chargePercent <= 15);
        }
      }

      function updateAudio(audio) {
        const playback = audio?.defaultPlaybackDevice;
        const recording = audio?.defaultRecordingDevice;
        const playbackVolume = getDeviceVolume(playback);
        const recordingVolume = getDeviceVolume(recording);
        const isMuted = playback?.isMuted || playbackVolume === 0;

        setText(elements.audio, `${getVolumeIcon(playback)} ${isMuted ? "" : `${Math.round(playbackVolume)}%`}`);
        setClassFlag(elements.audio, "muted", isMuted);
        setText(elements.mic, `${recording?.isMuted || recordingVolume === 0 ? "" : ""} ${Math.round(recordingVolume)}%`);
        setClassFlag(elements.mic, "muted", recording?.isMuted || recordingVolume === 0);
      }

      function updateKeyboard(keyboard) {
        const capsActive = keyboard?.capsLock || keyboard?.capslock;
        setText(elements.keyboard, `󰪛 ${capsActive ? "" : ""}`);
        setClassFlag(elements.keyboard, "active", capsActive);
      }

      bar.addEventListener("click", (event) => {
        const eventTarget = event.target instanceof Element ? event.target : event.target.parentElement;
        const target = eventTarget?.closest("[data-workspace], [data-action], [data-shell]");
        if (!target) return;

        event.preventDefault();
        event.stopPropagation();

        if (target.dataset.workspace) {
          runGlazeCommand(`focus --workspace ${target.dataset.workspace}`);
          return;
        }

        if (target.dataset.action === "media-play-pause") {
          currentOutput.media?.playPause?.();
          return;
        }

        if (target.dataset.action === "audio-toggle") {
          togglePlaybackVolume();
          return;
        }

        if (target.dataset.action === "tray-toggle") {
          isTrayExpanded = !isTrayExpanded;
          previousTraySignature = "";
          updateTray(currentOutput.systray);
          return;
        }

        if (target.dataset.shell) runShellAction(target.dataset.shell);
      });

      document.addEventListener("click", (event) => {
        if (!isTrayExpanded || event.target instanceof Node && elements.trayDrawer.contains(event.target)) return;
        isTrayExpanded = false;
        previousTraySignature = "";
        updateTray(currentOutput.systray);
      });

      elements.audio.addEventListener("contextmenu", (event) => {
        event.preventDefault();
        event.stopPropagation();
        runShellAction("audioSettings");
      });

      bar.addEventListener("auxclick", (event) => {
        const eventTarget = event.target instanceof Element ? event.target : event.target.parentElement;
        const target = eventTarget?.closest("[data-workspace]");
        if (!target?.dataset.workspace || event.button !== 1) return;

        event.preventDefault();
        event.stopPropagation();
        runGlazeCommand(`move --workspace ${target.dataset.workspace}`);
      });

      bar.addEventListener("wheel", (event) => {
        const eventTarget = event.target instanceof Element ? event.target : event.target.parentElement;
        if (!eventTarget?.closest(".workspaces")) return;

        event.preventDefault();
        runGlazeCommand(event.deltaY > 0 ? "focus --next-active-workspace" : "focus --prev-active-workspace");
      });

      function togglePlaybackVolume() {
        const audio = currentOutput.audio;
        const playback = audio?.defaultPlaybackDevice;
        const currentVolume = getDeviceVolume(playback);

        if (!playback) {
          runShellAction("audioSettings");
          return;
        }

        if (audio?.setMute) {
          audio.setMute(!playback.isMuted, { deviceId: getDeviceId(playback) });
          return;
        }

        if (audio?.setMuted) {
          audio.setMuted(getDeviceId(playback), !playback.isMuted);
          return;
        }

        if (!audio?.setVolume) {
          runShellAction("audioSettings");
          return;
        }

        if (currentVolume > 0) {
          previousPlaybackVolume = currentVolume;
          audio.setVolume(0);
          return;
        }

        audio.setVolume(Math.max(previousPlaybackVolume, 20));
      }

      providers.onOutput(() => update({ ...providers.outputMap }));
      update(providers.outputMap);
    </script>
  </body>
